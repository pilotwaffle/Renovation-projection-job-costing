<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Offline - Renovation Job Costing</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 400px;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            line-height: 1.6;
        }
        .button {
            background: white;
            color: #2563eb;
            border: none;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .status {
            margin-top: 2rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📱</div>
        <h1>You're Offline</h1>
        <p>
            Don't worry! You can still access your recently viewed jobs and track time offline.
            Your changes will sync when you reconnect.
        </p>
        <a href="/" class="button">Continue Offline</a>
        <div class="status" id="status">
            Checking connection...
        </div>
    </div>

    <script>
        // Check connection status periodically
        function checkConnection() {
            const status = document.getElementById('status');
            if (navigator.onLine) {
                status.textContent = 'Connection restored! You can refresh the page.';
                status.style.color = '#4ade80';
            } else {
                status.textContent = 'Still offline. Your data will be saved locally.';
                status.style.color = '#fbbf24';
            }
        }

        // Initial check
        checkConnection();

        // Listen for connection changes
        window.addEventListener('online', checkConnection);
        window.addEventListener('offline', checkConnection);

        // Check every 5 seconds
        setInterval(checkConnection, 5000);
    </script>
</body>
</html>
